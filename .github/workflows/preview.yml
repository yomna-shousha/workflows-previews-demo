name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# One run at a time per pull request, so a close never races a deploy.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      - name: Deploy Preview and its Workflow
        id: preview
        run: npm run preview:deploy

      - name: Smoke test
        run: npm run smoke -- "${{ steps.preview.outputs.url }}" "preview:${PREVIEW_NAME}"

      - name: Comment on pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > comment.md <<EOF
          ### Preview \`${PREVIEW_NAME}\`

          ${{ steps.preview.outputs.url }}

          Workflow: \`${{ steps.preview.outputs.workflows }}\` (owned by Worker \`${{ steps.preview.outputs.companion }}\`)

          Deleted when this pull request closes.
          EOF
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md --edit-last --create-if-none

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Delete Preview and its Workflow
        run: npm run preview:delete
